name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Check the dev Compose file is valid
        run: docker compose --env-file .env.example -f infra/docker/compose.dev.yml config --quiet
      - run: pnpm turbo run lint typecheck test
